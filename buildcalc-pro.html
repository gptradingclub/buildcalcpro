/* ─── CALC ENGINE ─────────────────────────────────────── */
function calc(trade, sp) {
  let lh=0,lc=0,mc=0,notes=[],bd=[];
  const sf=parseFloat(sp.sqft)||0;
  if(trade==="roofing"){
    // Pitch multiplier - steeper = much harder/slower
    const pm={"3/12 (Flat-ish, walkable)":0.95,"4/12 (Low slope)":1,"6/12 (Medium - standard)":1.1,"8/12 (Steep)":1.25,"10/12 (Very Steep)":1.45,"12/12+ (Extreme - rope required)":1.75}[sp.pitch]||1;
    // Tear-off layers cost
    const la={"0 (New construction)":0,"1 Layer":3*sf/100*12,"2 Layers":6*sf/100*12,"3+ Layers (heavy)":10*sf/100*12}[sp.layers]||0;
    const sq=sf/100;
    // Material per square (100 sqft)
    const mp={"Asphalt Shingles (3-tab)":95,"Architectural Shingles (30-yr)":140,"Architectural Shingles (50-yr premium)":195,"Metal Roofing (standing seam)":480,"Metal Roofing (corrugated)":340,"Tile (clay/concrete)":450,"Slate":850,"Cedar Shake":520,"Flat/TPO":210,"EPDM Rubber":180}[sp.material]||140;
    // Labor per square
    const lr={"Asphalt Shingles (3-tab)":60,"Architectural Shingles (30-yr)":75,"Architectural Shingles (50-yr premium)":85,"Metal Roofing (standing seam)":210,"Metal Roofing (corrugated)":155,"Tile (clay/concrete)":220,"Slate":340,"Cedar Shake":195,"Flat/TPO":130,"EPDM Rubber":115}[sp.material]||75;
    // Chimney flashing — major detail work
    const ch={"0 chimneys":0,"1 chimney (re-flash only)":350,"1 chimney (full re-build)":1400,"2 chimneys":900,"2+ chimneys (complex)":2200}[sp.chimneys]||0;
    // Ridge vent
    const rv={"No":0,"Yes - standard":sq*8,"Yes - whole ridge":sq*14}[sp.ridgeVent]||0;
    // Gutters (priced per linear ft, estimated as roof perimeter ~ 4*sqrt(sf))
    const linFt=Math.ceil(4*Math.sqrt(sf));
    const gu={"No (separate)":0,"Yes - 5\" K-style":linFt*9,"Yes - 6\" oversized":linFt*12,"Yes - copper/premium":linFt*28}[sp.gutters]||0;
    lh=sq*pm*(sp.material==="Tile (clay/concrete)"?10:sp.material==="Slate"?14:/Metal/.test(sp.material||"")?9:6);
    mc=sq*mp + la*0.2 + (parseFloat(sp.valleys)||0)*120 + ch*0.45 + (parseFloat(sp.skylights)||0)*250 + rv*0.6 + gu*0.65 + 450 + sq*30;
    lc=sq*lr*pm + la + ch*0.55 + rv*0.4 + gu*0.35;
    bd=[
      {i:sp.material||"Roofing material",q:`${sq.toFixed(1)} squares`,c:sq*mp},
      {i:"Underlayment & ice shield",q:`${sq.toFixed(1)} sq`,c:sq*18},
      {i:"Ridge cap & starter strip",q:"Package",c:sq*8},
      {i:`Install labor`,q:`${sq.toFixed(1)} sq @ $${lr}/sq`,c:sq*lr*pm},
      {i:"Pitch surcharge",q:sp.pitch||"—",c:sq*lr*(pm-1)},
      {i:"Tear-off labor",q:sp.layers||"—",c:la},
      {i:"Valley flashing",q:`${sp.valleys||0} valleys`,c:(parseFloat(sp.valleys)||0)*120},
      {i:"Chimney flashing",q:sp.chimneys||"—",c:ch},
      {i:"Ridge vent",q:sp.ridgeVent||"—",c:rv},
      {i:"Skylight/pipe flashing",q:`${sp.skylights||0} units`,c:(parseFloat(sp.skylights)||0)*250},
      {i:"Gutters & downspouts",q:sp.gutters==="No (separate)"?"—":`${linFt} lin ft`,c:gu},
      {i:"Dumpster/disposal",q:"1",c:450},
      {i:"Nails, fasteners",q:"—",c:sq*12},
    ];
    notes=[
      `${sp.material}: $${lr}/sq labor · Pitch ×${pm}`,
      `${sq.toFixed(1)} total squares (100 sq ft each) · ${linFt} ft perimeter est.`,
      sp.chimneys&&sp.chimneys!=="0 chimneys"?`⚠ Chimney work — verify flashing condition on-site`:"10% waste for hips/valleys included",
    ];
  } else if(trade==="flooring"){
    const mp={"Hardwood - Solid (3/4\")":7.5,"Hardwood - Engineered":6.5,"LVP / Luxury Vinyl Plank":4.5,"Tile (12x12)":4,"Tile (12x24)":4.5,"Tile (24x24)":5.5,"Tile (Large format 24x48+)":7.5,"Porcelain wood-look planks":6,"Natural stone (travertine, slate)":11,"Laminate":3,"Carpet":3.5,"Polished concrete":2.5}[sp.material]||4.5;
    const lr={"Hardwood - Solid (3/4\")":5.5,"Hardwood - Engineered":4.5,"LVP / Luxury Vinyl Plank":3.5,"Tile (12x12)":7,"Tile (12x24)":7.5,"Tile (24x24)":8,"Tile (Large format 24x48+)":11,"Porcelain wood-look planks":9,"Natural stone (travertine, slate)":13,"Laminate":3,"Carpet":1.5,"Polished concrete":6}[sp.material]||3.5;
    // Pattern complexity - HUGE labor impact
    const pat={"Standard straight lay":1,"Diagonal (+25% labor)":1.25,"Herringbone / Chevron (+50% labor)":1.5,"Versailles / Custom (+75% labor)":1.75}[sp.pattern]||1;
    const da={"No (new construction)":0,"Yes - Carpet/Vinyl":sf*0.8,"Yes - Laminate/LVP":sf*1.0,"Yes - Tile/Hardwood (heavy)":sf*2.5,"Yes - Glued-down (worst case)":sf*4}[sp.demo]||0;
    const sa={"Good (No repair)":0,"Minor squeaks / loose nails":sf*0.4,"Moisture barrier needed":sf*0.8,"Self-leveling compound needed":sf*2.2,"Full plywood replacement needed":sf*4.5}[sp.subfloor]||0;
    const stairs=parseFloat(sp.stairs)||0;
    const transitions=parseFloat(sp.transitions)||0;
    // Baseboards
    const bb={"No baseboards":0,"Re-install existing":sf*0.4,"New baseboards (paint grade)":Math.ceil(4*Math.sqrt(sf))*4.5,"New baseboards (premium)":Math.ceil(4*Math.sqrt(sf))*8.5}[sp.baseboards]||0;
    mc = sf*1.1*mp + sa*0.3 + da*0.3 + stairs*45 + transitions*22 + bb*0.4;
    lc = sf*lr*pat + da + sa*0.5 + stairs*85 + transitions*55 + (parseFloat(sp.rooms)||1)*80 + bb*0.6;
    lh=lc/55;
    bd=[
      {i:sp.material||"Flooring",q:`${(sf*1.1).toFixed(0)} sq ft (+10% waste)`,c:sf*1.1*mp},
      {i:"Underlayment / adhesive / thinset",q:`${sf} sq ft`,c:sf*0.6},
      {i:`Install labor — ${sp.pattern||"straight"}`,q:`$${(lr*pat).toFixed(2)}/sf`,c:sf*lr*pat},

    const trimLab={"No trim work included":0,"Pine / wood trim (paint grade)":6,"Azek PVC trim (premium - no rot)":11,"Boral TruExterior (premium composite)":12,"Fiber cement trim (HardieTrim)":9,"Aluminum wrap (cap existing)":7}[sp.trimBrand]||0;
    const trimLf=parseFloat(sp.trimLinFt)||0;
    // Soffit & fascia
    const sfMat={"Not included":0,"Vinyl soffit + aluminum fascia":4.5,"Wood soffit (paint)":6,"Azek/PVC soffit (premium)":13}[sp.soffit]||0;
    const sfLab={"Not included":0,"Vinyl soffit + aluminum fascia":7,"Wood soffit (paint)":8.5,"Azek/PVC soffit (premium)":11}[sp.soffit]||0;
    const soffitLf=parseFloat(sp.soffitLinFt)||0;
    // Shutters
    const sh={"None":0,"Vinyl shutters (8 windows)":520,"Composite shutters":1100,"Wood shutters (paint)":1450}[sp.shutters]||0;
    const wi=parseFloat(sp.windows)||0;
    mc = sf*1.08*mp + wa + trimLf*trimMat + soffitLf*sfMat + wi*40 + sh*0.6;
    lc = (sf*lr*sm) + da + trimLf*trimLab*sm + soffitLf*sfLab*sm + wi*65 + sh*0.4;

    bd=[

    // Labor per linear ft
    const lr={"Finger-jointed pine (paint grade)":3.5,"Clear pine / poplar (paint grade)":4,"MDF trim (paint grade)":3.2,"PVC / Azek (exterior)":4.5,"Oak (stain grade)":6,"Maple / cherry / walnut (premium hardwood)":8,"Craftsman / built-up profiles":9,"Reclaimed wood":7.5}[sp.material]||4;

    // Finish/paint cost

    const coffered=parseFloat(sp.cofferedSqft)||0;
    const cofferedCost = coffered*(mp*2.5 + lr*3*pm);

      {i:`Countertop: ${sp.countertop||"—"}`,q:`${ctSqft} sqft`,c:ctCost},
      {i:`Backsplash: ${sp.backsplash||"—"}`,q:`${bsSqft} sqft`,c:bsCost},
      {i:"Wall/floor prep",q:sp.adjust||"—",c:aa},
      {i:"Shims, screws, fillers",q:"—",c:cq*12},

                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20,paddingBottom:16,borderBottom:"1px solid var(--bdr)"}}>
                  <div style={{width:62,height:46,borderRadius:8,overflow:"hidden",border:`1px solid ${T.color}44`,flexShrink:0,position:"relative",background:"#0d1018",display:"flex",alignItems:"center",justifyContent:"center",padding:3}}>
                    <img src={T.img} alt={T.label} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}}/>
                  </div>
                  <div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:800,letterSpacing:2,color:"#fff",textTransform:"uppercase"}}>{T.label} — Specs</div>
                    <div style={{fontSize:11,color:"#e5e7eb",letterSpacing:1,marginTop:3,fontWeight:500}}>Fill in your project details below</div>
                  </div>
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
                  {TRADES[trade].specs.map(sp=>(
                    <div key={sp.key}>
                      <div className="lbl">{sp.label}</div>
                      {sp.type==="select"
                        ?<select className="inp" value={specs[sp.key]||""} onChange={e=>setSpecs(s=>({...s,[sp.key]:e.target.value}))}>
                          <option value="">— Select —</option>
                          {sp.options.map(o=><option key={o} value={o}>{o}</option>)}
                        </select>
                        :<input className="inp" type="number" placeholder={sp.placeholder} value={specs[sp.key]||""} onChange={e=>setSpecs(s=>({...s,[sp.key]:e.target.value}))}/>
                      }
                    </div>
                  ))}
                </div>

                <div style={{marginBottom:18}}>
                  <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
                    <div className="lbl" style={{margin:0}}>ESTIMATE TYPE</div>
                    <div style={{flex:1,height:"1px",background:"var(--bdr)"}}/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                    {[{k:"labor",ico:"👷",l:"Labor Only",d:"Work cost"},{k:"material",ico:"📦",l:"Material Only",d:"Supplies"},{k:"both",ico:"⚡",l:"Labor + Material",d:"Full total"}].map(m=>(
                      <button key={m.k} className={`mode-btn ${mode===m.k?"on":""}`}
                        style={{"--accent":T.color}}
                        onClick={()=>{setMode(m.k);setResult(null);setAiTxt("");setShowAI(false);}}>
                        <div style={{fontSize:18,marginBottom:4}}>{m.ico}</div>
                        <div style={{fontSize:10,fontWeight:500,color:mode===m.k?T.color:"#ffffff",fontFamily:"'DM Mono',monospace",marginBottom:2}}>{m.l}</div>
                        <div style={{fontSize:8,color:"#e5e7eb"}}>{m.d}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{marginBottom:20}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div className="lbl" style={{margin:0}}>PROFIT MARGIN</div>
                      <div style={{flex:1,height:"1px",background:"var(--bdr)",width:60}}/>
                    </div>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:26,fontWeight:700,color:T.color,lineHeight:1,letterSpacing:-.5}}>{margin}%</div>
                  </div>
                  <input type="range" min="0" max="50" value={margin} onChange={e=>setMargin(Number(e.target.value))}
                    style={{background:`linear-gradient(to right,${T.color} ${margin*2}%,var(--bdr) ${margin*2}%)`}}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#e5e7eb",marginTop:6,letterSpacing:1}}>
                    <span>0% BREAK-EVEN</span><span>25%</span><span>50% MAX</span>
                  </div>
                </div>

                <button className="btn-calc" onClick={doCalc} disabled={loading}>
                  {loading
                    ?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><span className="spin"/>CALCULATING...</span>
                    :"CALCULATE ESTIMATE →"
                  }
                </button>
              </div>
            )}

            {result&&(
              <div ref={resRef} className="fade-up">

                <div style={{background:"linear-gradient(135deg,#0e1218,#111720)",border:`1px solid ${T.color}33`,borderRadius:16,padding:"28px 28px 24px",marginBottom:14,position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,transparent,${T.color},transparent)`}}/>
                  <div style={{position:"absolute",top:"50%",right:-60,transform:"translateY(-50%)",fontSize:120,opacity:.04,fontFamily:"'Syne',sans-serif",fontWeight:900,letterSpacing:-4,pointerEvents:"none",userSelect:"none"}}>$</div>

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:20}}>
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                        <span className="tag" style={{background:T.color+"18",color:T.color,border:`1px solid ${T.color}33`}}>
                          {mode==="labor"?"👷 Labor Only":mode==="material"?"📦 Material Only":"⚡ Full Estimate"}
                        </span>
                        {margin>0&&<span className="tag" style={{background:"#14532d18",color:"#22c55e",border:"1px solid #14532d33"}}>{margin}% Margin</span>}
                      </div>
                      <div className="lbl" style={{marginBottom:6}}>{mode==="labor"?"Labor Estimate":mode==="material"?"Material Estimate":"Total Project Estimate"}</div>
                      <div style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:56,fontWeight:700,color:"#fff",lineHeight:.95,letterSpacing:-1.5}}>{$(wm)}</div>
                      {margin>0&&<div style={{fontSize:10,color:"var(--muted)",marginTop:8}}>Base {$(da)} + {margin}% = <span style={{color:"#22c55e"}}>+{$(wm-da)}</span></div>}
                      <div style={{fontSize:10,color:"#e5e7eb",marginTop:6}}>Market range: {$(result.low)} — {$(result.high)}</div>
                    </div>

                    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                      {[
                        mode!=="material"&&{ic:"👷",lb:"Labor",v:$(result.lc)},
                        mode!=="labor"&&{ic:"📦",lb:"Material",v:$(result.mc)},
                        mode!=="material"&&{ic:"⏱",lb:"Hours",v:`${result.lh}h`},
                      ].filter(Boolean).map(({ic,lb,v})=>(
                        <div key={lb} className="stat">
                          <div style={{fontSize:18,marginBottom:5}}>{ic}</div>
                          <div style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:18,fontWeight:700,color:"#fff",lineHeight:1,letterSpacing:-.5}}>{v}</div>
                          <div style={{fontSize:8,color:"var(--muted)",letterSpacing:1,marginTop:3,textTransform:"uppercase"}}>{lb}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {mode==="both"&&(
                    <div style={{marginTop:22}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#e5e7eb",marginBottom:5,letterSpacing:1}}>
                        <span>LABOR {Math.round(result.lc/result.tot*100)}%</span>
                        <span>MATERIAL {Math.round(result.mc/result.tot*100)}%</span>
                      </div>
                      <div style={{background:"#0a0c12",borderRadius:4,height:5,overflow:"hidden"}}>
                        <div style={{background:`linear-gradient(90deg,${T.color},${T.color}88)`,height:"100%",width:`${result.lc/result.tot*100}%`,borderRadius:4,transition:"width .6s ease"}}/>
                      </div>
                    </div>
                  )}
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1.1fr .9fr",gap:12,marginBottom:14}}>
                  <div className="card">
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,paddingBottom:12,borderBottom:"1px solid var(--bdr)"}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:800,letterSpacing:2,color:"#fff",textTransform:"uppercase"}}>Cost Breakdown</div>
                      <div style={{flex:1,height:"1px",background:"var(--bdr)"}}/>
                    </div>
                    {result.bd.filter(b=>b.c>0).map((b,i)=>(
                      <div key={i} className="brow">
                        <span style={{color:"#ffffff",flex:1}}>{b.i}</span>
                        <span style={{color:"#ffffff",fontSize:10,textAlign:"right",marginRight:12,flexShrink:0}}>{b.q}</span>
                        <span style={{color:"#fff",fontWeight:500,flexShrink:0}}>{$(Math.round(b.c))}</span>
                      </div>
                    ))}
                    <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${T.color}33`}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                        <span style={{fontSize:11,color:"var(--muted)"}}>Subtotal</span>
                        <span style={{fontSize:11,color:"#ffffff"}}>{$(da)}</span>
                      </div>
                      {margin>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:11,color:"#22c55e"}}>+ Margin ({margin}%)</span>
                        <span style={{fontSize:11,color:"#22c55e"}}>+{$(wm-da)}</span>
                      </div>}
                      <div style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:T.color+"12",border:`1px solid ${T.color}33`,borderRadius:6,marginTop:6}}>
                        <span style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:800,color:"#fff"}}>TOTAL</span>
                        <span style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:15,fontWeight:700,color:T.color,letterSpacing:-.3}}>{$(wm)}</span>
                      </div>
                    </div>
                  </div>

                  <div className="card">
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,paddingBottom:12,borderBottom:"1px solid var(--bdr)"}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:800,letterSpacing:2,color:"#fff",textTransform:"uppercase"}}>Field Notes</div>
                      <div style={{flex:1,height:"1px",background:"var(--bdr)"}}/>
                    </div>
                    {result.notes.map((n,i)=>(
                      <div key={i} style={{display:"flex",gap:10,marginBottom:12,fontSize:11,color:"#ffffff",lineHeight:1.6}}>
                        <span style={{color:T.color,flexShrink:0,fontSize:10,marginTop:2}}>▸</span>
                        <span>{n}</span>
                      </div>
                    ))}
                    <div style={{marginTop:"auto",paddingTop:16,borderTop:"1px solid var(--bdr)",fontSize:9,color:"#e5e7eb",lineHeight:1.8}}>
                      Estimates vary by local market, site conditions & material costs. Verify with supplier quotes before committing.
                    </div>
                  </div>
                </div>

                <div className="card" style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:800,letterSpacing:2,color:"#fff",textTransform:"uppercase"}}>Client Info</div>
                      <span className="tag" style={{background:"#0d1018",color:"#ffffff",border:"1px solid var(--bdr)"}}>PDF Proposal</span>
                    </div>
                    <button className="btn-ghost" style={{padding:"7px 12px",fontSize:10}} onClick={()=>setShowClient(s=>!s)}>
                      {showClient?"▲ Collapse":"▼ Add Client Details"}
                    </button>
                  </div>
                  {showClient&&(
                    <div className="fade-up" style={{marginTop:16,paddingTop:16,borderTop:"1px solid var(--bdr)",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                      {[{k:"name",l:"Client Full Name",p:"John Smith"},{k:"company",l:"Company (optional)",p:"ABC Builders LLC"},{k:"phone",l:"Phone",p:"(555) 000-0000"},{k:"email",l:"Email",p:"client@email.com"},{k:"address",l:"Project Address",p:"123 Main Street"},{k:"city",l:"City",p:"Miami"},{k:"state",l:"State",p:"FL"},{k:"zip",l:"ZIP Code",p:"33101"}].map(f=>(
                        <div key={f.k}>
                          <div className="lbl">{f.l}</div>
                          <input className="inp" type="text" placeholder={f.p} value={client[f.k]||""} onChange={e=>setClient(c=>({...c,[f.k]:e.target.value}))}/>
                        </div>
                      ))}
                    </div>
                  )}
                  {!showClient&&client.name&&(
                    <div style={{marginTop:10,fontSize:11,color:"var(--muted)"}}>
                      👤 <strong style={{color:"#ffffff"}}>{client.name}</strong>{client.company?` · ${client.company}`:""}{client.city?` · ${client.city}, ${client.state}`:""}
                    </div>
                  )}
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                  <button className="btn-ai" onClick={doAI} disabled={aiLoad}>
                    {aiLoad
                      ?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><span className="spin"/>{aiStatus}</span>
                      :aiTxt?"🔄 Refresh Market":"🌐 Live Market Check"
                    }
                  </button>
                  <button className="btn-pdf" onClick={doPDF} disabled={pdfLoad}>
                    {pdfLoad
                      ?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><span className="spin"/>Generating...</span>
                      :"📄 Download PDF Proposal"
                    }
                  </button>
                  <button className="btn-ghost" onClick={doSave}>💾 Save Estimate</button>
                </div>

                {showAI&&(
                  <div className="fade-up" style={{background:"linear-gradient(135deg,#0e0818,#100c1e)",border:"1px solid #2d1b6e",borderRadius:12,padding:22,position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,transparent,#7c3aed,#a855f7,transparent)"}}/>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:10}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{background:"linear-gradient(135deg,#6d28d9,#8b5cf6)",borderRadius:6,padding:"3px 10px",fontSize:9,fontWeight:700,color:"#fff",letterSpacing:1.5,textTransform:"uppercase"}}>🤖 AI Advisor</div>
                        <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:800,letterSpacing:2,color:"#a855f7",textTransform:"uppercase"}}>Live Market Analysis</div>
                      </div>
                      {aiStatus&&<div style={{fontSize:9,letterSpacing:1,color:aiStatus.startsWith("✅")?"#4ade80":aiStatus.startsWith("❌")?"#f87171":"#a855f7",display:"flex",alignItems:"center",gap:5,textTransform:"uppercase"}}>
                        {aiLoad&&<span className="spin" style={{borderTopColor:"#a855f7"}}/>}{aiStatus}
                      </div>}
                    </div>
                    {!aiLoad&&aiTxt&&(
                      <div style={{marginBottom:14,padding:"8px 12px",background:"rgba(124,58,237,.08)",border:"1px solid rgba(124,58,237,.2)",borderRadius:6,fontSize:9,color:"#7c3aed",display:"flex",gap:8,alignItems:"flex-start",letterSpacing:.5}}>
                        <span style={{flexShrink:0}}>🌐</span>
                        <span>Live web search used — current 2025 US market prices retrieved and compared against your estimate. Results vary by region; use as a reference benchmark.</span>
                      </div>
                    )}
                    {aiLoad?(
                      <div style={{padding:"24px 0",display:"flex",flexDirection:"column",gap:12}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,color:"#a855f7",fontSize:12}}>
                          <span className="spin" style={{borderTopColor:"#a855f7",width:16,height:16}}/>{aiStatus||"Connecting..."}
                        </div>
                        {["Searching current material prices...","Looking up 2025 labor rates...","Checking market trends & tariffs...","Comparing against your estimate..."].map((s,i)=>(
                          <div key={i} style={{fontSize:10,color:"#e5e7eb",paddingLeft:26,animation:"pulse 1.5s ease infinite",animationDelay:`${i*0.2}s`}}>→ {s}</div>
                        ))}
                      </div>
                    ):(
                      <div style={{fontSize:12,color:"#a8a29e",lineHeight:1.9}} dangerouslySetInnerHTML={renderHTML(aiTxt)}/>
                    )}
                  </div>
                )}
              </div>
            )}

            {!trade&&(
              <div style={{textAlign:"center",padding:"80px 0 60px",opacity:mounted?1:0,transition:"opacity .6s"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:48,fontWeight:900,letterSpacing:4,color:"#1e2330",marginBottom:12,lineHeight:1}}>SELECT A TRADE</div>
                <div style={{fontSize:12,color:"#e5e7eb",letterSpacing:1}}>Choose a trade above to start your professional estimate</div>
              </div>
            )}
          </>)}

          <footer style={{marginTop:64,paddingTop:24,borderTop:"1px solid #0f1218",textAlign:"center"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:10}}>
              <div style={{width:24,height:24,borderRadius:6,background:"linear-gradient(135deg,#ea6d0a,#f97316)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>🏗️</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:900,letterSpacing:3,color:"#1e2330"}}>BUILDCALC PRO</div>
            </div>
            <div style={{fontSize:10,color:"#1e2330",marginBottom:6}}>
              Designed & Developed by <span style={{color:"#f97316",fontWeight:600}}>Gil Pesantez</span>
            </div>
            <div style={{fontSize:9,color:"#161820",display:"flex",gap:12,justifyContent:"center",alignItems:"center",flexWrap:"wrap"}}>
              <a href="mailto:gptradingclub@gmail.com" style={{color:"#1e2330",textDecoration:"none"}}>gptradingclub@gmail.com</a>
              <span>·</span>
              <span>© {new Date().getFullYear()} Gil Pesantez. All rights reserved.</span>
            </div>
            <div style={{fontSize:8,color:"#111318",letterSpacing:1.5,textTransform:"uppercase",marginTop:8}}>Proprietary Software · Unauthorized Reproduction Prohibited</div>
          </footer>
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 500);
      }
    }, 600);
  </script>

</body>
</html>
